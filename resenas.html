<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dejar Reseña | LEMURIA</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%237C3AED'/><stop offset='100%25' stop-color='%23EC4899'/></linearGradient></defs><rect width='100' height='100' rx='20' fill='%23050510'/><path d='M25 20 L25 80 L75 80' stroke='url(%23g)' stroke-width='12' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        noche: '#050510', indigo: '#0D0D1A', violeta: '#7C3AED', purpura: '#A855F7',
                        magenta: '#EC4899', cyan: '#06B6D4', texto: '#F1F0FF', gris: '#8B8BA3',
                        muted: '#4A4A6A', exito: '#34D399',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050510; color: #F1F0FF; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(124,58,237,0.15); }
        .gradient-text { background: linear-gradient(135deg, #7C3AED, #EC4899, #06B6D4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .portal-btn { position: relative; overflow: hidden; background: linear-gradient(135deg, #7C3AED, #EC4899); transition: all 0.3s; }
        .portal-btn::before { content: ''; position: absolute; inset: -50%; background: conic-gradient(from 0deg, transparent, #7C3AED, #EC4899, transparent); animation: portal-spin 3s linear infinite; }
        .portal-btn::after { content: ''; position: absolute; inset: 2px; background: linear-gradient(135deg, #7C3AED, #EC4899); border-radius: inherit; }
        .portal-btn span { position: relative; z-index: 1; }
        @keyframes portal-spin { to { transform: rotate(360deg); } }
        .portal-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .portal-btn:disabled::before { animation: none; }
        .star-btn { cursor: pointer; transition: transform 0.15s ease, color 0.15s ease; background: none; border: none; padding: 0; display: inline-flex; color: #4A4A6A; font-size: 2rem; line-height: 1; }
        @media (min-width: 768px) { .star-btn { font-size: 2.5rem; } }
        .star-btn:hover { transform: scale(1.2); }
        .star-btn.active, .star-btn.hovered { color: #EC4899; }
        .dot-grid { background-image: radial-gradient(circle, rgba(124,58,237,0.15) 1px, transparent 1px); background-size: 24px 24px; }
        ::selection { background: rgba(124,58,237,0.4); color: #fff; }
        input, textarea { font-size: 16px; }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center px-4 dot-grid">
    <div class="max-w-lg w-full">
        <a href="https://lemurianos.vercel.app/" class="inline-flex items-center gap-2 text-gris hover:text-violeta transition-colors mb-10 text-sm font-mono tracking-wide group">
            <i class="ph-bold ph-arrow-left group-hover:-translate-x-1 transition-transform"></i> Volver al sitio
        </a>

        <div class="text-center mb-10">
            <div class="w-16 h-16 rounded-2xl glass flex items-center justify-center mx-auto mb-6">
                <i class="ph-fill ph-star text-4xl text-violeta"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold mb-3 tracking-[-0.02em]">Dejá tu Reseña</h1>
            <p class="text-gris">Contanos tu experiencia con Lemuria. Tu opinión ayuda a otros negocios a confiar en nosotros.</p>
        </div>

        <div class="glass rounded-3xl p-6 md:p-10">
            <form id="review-form" class="space-y-6">
                <div>
                    <label for="empresa" class="block text-sm font-medium text-texto mb-2 font-mono tracking-wide">Nombre de tu empresa</label>
                    <input type="text" id="empresa" required placeholder="Ej: Villa Silvina" 
                        class="w-full px-4 py-3 rounded-xl bg-noche/50 border border-white/10 text-texto placeholder-muted focus:outline-none focus:border-violeta focus:ring-1 focus:ring-violeta transition-colors">
                </div>

                <div>
                    <label class="block text-sm font-medium text-texto mb-2 font-mono tracking-wide">¿Cómo fue tu experiencia?</label>
                    <div class="flex items-center gap-1" id="star-container">
                        <button type="button" class="star-btn" data-value="1">★</button>
                        <button type="button" class="star-btn" data-value="2">★</button>
                        <button type="button" class="star-btn" data-value="3">★</button>
                        <button type="button" class="star-btn" data-value="4">★</button>
                        <button type="button" class="star-btn" data-value="5">★</button>
                    </div>
                    <input type="hidden" id="estrellas" value="0">
                </div>

                <div>
                    <label for="descripcion" class="block text-sm font-medium text-texto mb-2 font-mono tracking-wide">Tu opinión</label>
                    <textarea id="descripcion" required rows="4" placeholder="Contanos qué te pareció el servicio..."
                        class="w-full px-4 py-3 rounded-xl bg-noche/50 border border-white/10 text-texto placeholder-muted focus:outline-none focus:border-violeta focus:ring-1 focus:ring-violeta transition-colors resize-none"></textarea>
                </div>

                <button type="submit" id="submit-btn" class="w-full portal-btn py-4 rounded-xl text-lg font-bold flex items-center justify-center gap-2">
                    <span><i class="ph-bold ph-paper-plane-right"></i> Publicar Reseña</span>
                </button>
            </form>

            <div id="success-msg" class="hidden text-center py-8">
                <div class="w-16 h-16 rounded-full bg-exito/10 flex items-center justify-center mx-auto mb-4">
                    <i class="ph-fill ph-check-circle text-4xl text-exito"></i>
                </div>
                <h2 class="text-2xl font-bold text-texto mb-2">¡Gracias por tu reseña!</h2>
                <p class="text-gris">Será revisada antes de publicarse en nuestro sitio.</p>
                <a href="https://lemurianos.vercel.app/" class="inline-flex items-center gap-2 mt-6 text-violeta hover:text-magenta transition-colors font-medium group">
                    Volver al sitio <i class="ph-bold ph-arrow-right group-hover:translate-x-1 transition-transform"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://iuhcdfvzgyrowbaqdagg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1aGNkZnZ6Z3lyb3diYXFkYWdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMjkyMTcsImV4cCI6MjA5NDgwNTIxN30.AeEryLxTtqINNyxbMIxXUYFV46nlTd5b1jJ-ikjzVNU';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const starBtns = document.querySelectorAll('.star-btn');
        const estrellasInput = document.getElementById('estrellas');
        let selectedStars = 0;

        function setStars(value) {
            selectedStars = value;
            estrellasInput.value = value;
            starBtns.forEach(btn => btn.classList.toggle('active', parseInt(btn.dataset.value) <= value));
        }

        starBtns.forEach(btn => {
            btn.addEventListener('click', () => setStars(parseInt(btn.dataset.value)));
            btn.addEventListener('mouseenter', () => {
                const v = parseInt(btn.dataset.value);
                starBtns.forEach(b => b.classList.toggle('hovered', parseInt(b.dataset.value) <= v));
            });
        });

        document.getElementById('star-container').addEventListener('mouseleave', () => {
            starBtns.forEach(btn => btn.classList.remove('hovered'));
            setStars(selectedStars);
        });

        setStars(0);

        document.getElementById('review-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const empresa = document.getElementById('empresa').value.trim();
            const estrellas = parseInt(document.getElementById('estrellas').value);
            const descripcion = document.getElementById('descripcion').value.trim();

            if (!empresa || !descripcion) return;
            if (estrellas < 1 || estrellas > 5) { alert('Por favor seleccioná una calificación.'); return; }

            btn.disabled = true;
            btn.innerHTML = '<span><i class="ph-bold ph-spinner animate-spin"></i> Enviando...</span>';

            try {
                const { data, error } = await sb.from('reviews').insert([{ empresa, estrellas, descripcion, aprobada: false }]).select().single();
                if (error) throw error;
                try { await sb.functions.invoke('send-approval-email', { body: { reviewId: data.id, empresa, estrellas, descripcion } }); } catch (e) { console.error('Email error:', e); }
                document.getElementById('review-form').classList.add('hidden');
                document.getElementById('success-msg').classList.remove('hidden');
            } catch (error) {
                console.error('Error:', error);
                btn.disabled = false;
                btn.innerHTML = '<span><i class="ph-bold ph-paper-plane-right"></i> Publicar Reseña</span>';
                alert('Hubo un error. Intentá de nuevo.');
            }
        });
    </script>
</body>
</html>
