<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprobando Reseña | LEMURIA</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%237C3AED'/><stop offset='100%25' stop-color='%23EC4899'/></linearGradient></defs><rect width='100' height='100' rx='20' fill='%23050510'/><path d='M25 20 L25 80 L75 80' stroke='url(%23g)' stroke-width='12' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        noche: '#050510', violeta: '#7C3AED', magenta: '#EC4899',
                        texto: '#F1F0FF', gris: '#8B8BA3', muted: '#4A4A6A', exito: '#34D399',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050510; color: #F1F0FF; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(124,58,237,0.15); }
        .gradient-text { background: linear-gradient(135deg, #7C3AED, #EC4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .dot-grid { background-image: radial-gradient(circle, rgba(124,58,237,0.15) 1px, transparent 1px); background-size: 24px 24px; }
        ::selection { background: rgba(124,58,237,0.4); color: #fff; }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center px-4 dot-grid">
    <div class="max-w-md w-full text-center px-4" id="loading-state">
        <div class="relative w-20 h-20 md:w-24 md:h-24 mx-auto mb-6 md:mb-8">
            <svg class="w-20 h-20 md:w-24 md:h-24" viewBox="0 0 48 48">
                <circle cx="24" cy="24" r="20" fill="none" stroke="rgba(124,58,237,0.15)" stroke-width="2"/>
                <circle cx="24" cy="24" r="20" fill="none" stroke="url(#progressGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="125.66" stroke-dashoffset="125.66" class="animate-spin" style="animation-duration: 1.5s; transform-origin: center;"/>
                <defs><linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#EC4899"/></linearGradient></defs>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
                <i class="ph-bold ph-spinner animate-spin text-3xl text-violeta"></i>
            </div>
        </div>
        <h1 class="text-2xl font-bold mb-2 tracking-[-0.02em]">Aprobando reseña...</h1>
        <p class="text-gris font-mono text-sm">Un momento por favor.</p>
    </div>

    <div class="max-w-md w-full text-center hidden px-4" id="success-state">
        <div class="w-20 h-20 md:w-24 md:h-24 rounded-full bg-exito/10 flex items-center justify-center mx-auto mb-6 md:mb-8">
            <i class="ph-fill ph-check-circle text-5xl text-exito"></i>
        </div>
        <h1 class="text-2xl font-bold mb-2 tracking-[-0.02em]">Reseña aprobada</h1>
        <p class="text-gris mb-6">La reseña ya está publicada en el sitio.</p>
        <p class="text-sm font-mono text-muted">Redirigiendo al sitio en <span id="countdown" class="text-violeta">3</span> segundos...</p>
        <a href="https://lemurianos.vercel.app/" class="inline-flex items-center gap-2 mt-4 text-violeta hover:text-magenta transition-colors font-medium group">
            Ir al sitio ahora <i class="ph-bold ph-arrow-right group-hover:translate-x-1 transition-transform"></i>
        </a>
    </div>

    <div class="max-w-md w-full text-center hidden px-4" id="error-state">
        <div class="w-20 h-20 md:w-24 md:h-24 rounded-full bg-red-500/10 flex items-center justify-center mx-auto mb-6 md:mb-8">
            <i class="ph-fill ph-x-circle text-5xl text-red-500"></i>
        </div>
        <h1 class="text-2xl font-bold mb-2 tracking-[-0.02em]">Error al aprobar</h1>
        <p class="text-gris mb-6" id="error-msg">No se encontró la reseña o ya fue aprobada.</p>
        <a href="https://lemurianos.vercel.app/" class="inline-flex items-center gap-2 text-violeta hover:text-magenta transition-colors font-medium group">
            Volver al sitio <i class="ph-bold ph-arrow-right group-hover:translate-x-1 transition-transform"></i>
        </a>
    </div>

    <script>
        const SUPABASE_URL = 'https://iuhcdfvzgyrowbaqdagg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1aGNkZnZ6Z3lyb3diYXFkYWdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMjkyMTcsImV4cCI6MjA5NDgwNTIxN30.AeEryLxTtqINNyxbMIxXUYFV46nlTd5b1jJ-ikjzVNU';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const params = new URLSearchParams(window.location.search);
        const reviewId = params.get('id');

        if (!reviewId) {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('error-state').classList.remove('hidden');
            document.getElementById('error-msg').textContent = 'No se proporcionó un ID de reseña válido.';
        } else {
            sb.from('reviews').update({ aprobada: true }).eq('id', reviewId).select().then(({ data, error }) => {
                document.getElementById('loading-state').classList.add('hidden');
                if (error) {
                    document.getElementById('error-state').classList.remove('hidden');
                    document.getElementById('error-msg').textContent = 'No se encontró la reseña.';
                } else if (!data || data.length === 0) {
                    document.getElementById('error-state').classList.remove('hidden');
                    document.getElementById('error-msg').textContent = 'Esta reseña ya fue aprobada anteriormente.';
                } else {
                    document.getElementById('success-state').classList.remove('hidden');
                    let count = 3;
                    const countdownEl = document.getElementById('countdown');
                    const interval = setInterval(() => {
                        count--; countdownEl.textContent = count;
                        if (count <= 0) { clearInterval(interval); window.location.href = 'https://lemurianos.vercel.app/'; }
                    }, 1000);
                }
            });
        }
    </script>
</body>
</html>
